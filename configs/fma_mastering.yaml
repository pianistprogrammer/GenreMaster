experiment:
  name: "fma-genremaster"
  description: "Genre-conditioned mastering on FMA-small with per-genre LUFS priors"
  seed: 42

data:
  dataset: "fma_small"
  audio_dir: "/Volumes/LLModels/Datasets/fma_small"
  metadata_csv: "/Users/I558118/Documents/Projects/GenreMaster/data/fma_metadata/tracks.csv"
  lufs_priors: "/Users/I558118/Documents/Projects/GenreMaster/experiments/fma_mastering/genre_lufs_priors.json"
  sample_rate: 22050
  duration: 30.0
  n_genres: 8
  augment_train: true

model:
  encoder_type: "lightweight"
  audio_feature_dim: 512
  genre_latent_dim: 128
  conditioned: true
  n_genres: 8

training:
  batch_size: 8
  num_epochs: 50
  learning_rate: 1.0e-4
  weight_decay: 1.0e-5
  lr_scheduler: "cosine"
  warmup_epochs: 5
  grad_clip: 0.5
  save_every: 5
  keep_last_n: 3
  patience: 15
  min_delta: 1.0e-4

loss:
  weights:
    loudness: 1.0
    spectral: 0.5
    dynamic: 0.5
    perceptual: 0.1

optimizer:
  name: "adam"
  betas: [0.9, 0.999]
  eps: 1.0e-8

device:
  type: "auto"
  num_workers: 0

logging:
  use_trackio: true
  log_every: 10
  trackio:
    project: "genremaster"
    experiment: "fma-mastering"

output:
  checkpoint_dir: "results/fma/checkpoints"
  log_dir: "results/fma/logs"
  audio_dir: "results/fma/audio_samples"
