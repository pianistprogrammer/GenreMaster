experiment:
  name: "fma-genre-classifier"
  description: "ResNet genre classifier on FMA-small (8 genres)"
  seed: 42

data:
  audio_dir: "/Volumes/LLModels/Datasets/fma_small"
  metadata_csv: "/Users/I558118/Documents/Projects/GenreMaster/data/fma_metadata/tracks.csv"
  sample_rate: 22050
  duration: 30.0
  n_genres: 8

model:
  type: "resnet"
  n_genres: 8
  n_mels: 128
  n_fft: 2048
  hop_length: 512
  dropout: 0.5
  pretrained: true
  spec_augment: true

training:
  batch_size: 16
  num_epochs: 30
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  lr_scheduler: "cosine"
  warmup_epochs: 2
  patience: 8
  min_delta: 1.0e-4
  grad_clip: 1.0

optimizer:
  name: "adam"
  betas: [0.9, 0.999]
  eps: 1.0e-8

device:
  type: "auto"
  num_workers: 0

output:
  checkpoint_dir: "results/fma/classifier"
  log_dir: "results/fma/logs"
